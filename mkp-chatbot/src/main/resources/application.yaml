server:
  port: 8085

spring:
  application:
    name: mkp-chatbot
  ai:
    model:
      chat: dashscope              # 切换 DeepSeek：改成 deepseek 并配置 DEEPSEEK_API_KEY
      embedding:
        text: dashscope
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v3
          dimensions: 1024
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mkp_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        ip: 127.0.0.1
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms


mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# ========== 向量检索知识库配置 ==========
mkp:
  ai:
    embedding:
      batch-size: 10                         # DashScope 单请求最多 10 条 input
  knowledge:
    vector:
      enabled: true                          # 是否启用向量检索（false 则回退到关键词匹配）
      top-k: 5                               # 返回 Top-K 条相似结果
      similarity-threshold: 0.75             # 余弦相似度阈值，低于此值的结果过滤掉
      embedding-dim: 1024                    # text-embedding-v3 默认 1024 维

# ========== Prompt 模板化管理配置 ==========
  chatbot:
    prompt:
      # 默认 Prompt 场景标识
      scene: default
      # 缓存过期时间（分钟）
      cache-ttl-minutes: 10

