server:
  port: 8085

spring:
  application:
    name: mkp-chatbot
  ai:
    model:
      chat: dashscope              # 切换 DeepSeek：改成 deepseek 并配置 DEEPSEEK_API_KEY
      embedding:
        text: dashscope
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v3
          dimensions: 1024
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mkp_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        ip: 127.0.0.1
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  servlet:
    multipart:
      max-file-size: 10MB                    # 长文档上传上限
      max-request-size: 10MB


mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# ========== 向量检索知识库配置 ==========
mkp:
  ai:
    embedding:
      batch-size: 10                         # DashScope 单请求最多 10 条 input
  knowledge:
    vector:
      enabled: true                          # 是否启用向量检索（false 则回退到关键词匹配）
      top-k: 10                              # 返回 Top-K 条相似结果
      similarity-threshold: 0.5              # 余弦相似度阈值，低于此值的结果过滤掉
      embedding-dim: 1024                    # text-embedding-v3 默认 1024 维
      chunk:                                 # 长文档父子块
        enabled: true
        child-size: 300                      # 子块目标字数
        child-overlap: 60                    # 子块重叠字数（约 20%）
        parent-max-size: 1200                # 父块最大字数
        recall-top-k: 20                     # 子块粗筛召回条数
        max-parents: 4                       # 去重后最多返回几个父块
        max-total-chars: 3000                # 拼给大模型的父块正文总字数上限

# ========== Prompt 模板化管理配置 ==========
  chatbot:
    prompt:
      # 默认 Prompt 场景标识
      scene: default
      # 缓存过期时间（分钟）
      cache-ttl-minutes: 10
    router:
      # 意图路由：主模型调用前先分类，只挂载对应意图的工具
      enabled: true
      # 关键词规则未命中时，用一次低温小模型分类兜底（1.5s 超时，失败降级 MIXED）
      llm-enabled: true
    planner:
      # 多意图问题先做全局规划（拆 1-3 步 → 分步执行 → 一次性汇总）；单意图不触发
      enabled: true

