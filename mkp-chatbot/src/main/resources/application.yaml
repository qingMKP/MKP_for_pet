server:
  port: 8085

spring:
  application:
    name: mkp-chatbot
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mkp_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        ip: 127.0.0.1
  redis:
    host: 127.0.0.1
    port: 6379
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms


mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

deepseek:
  api-key: ${DEEPSEEK_API_KEY}
  api-url: https://api.deepseek.com/v1/chat/completions
  model: deepseek-chat

# ========== 向量检索知识库配置 ==========
mkp:
  knowledge:
    vector:
      enabled: true                          # 是否启用向量检索（false 则回退到关键词匹配）
      top-k: 5                               # 返回 Top-K 条相似结果
      similarity-threshold: 0.75             # 余弦相似度阈值，低于此值的结果过滤掉
      embedding-model: "text-embedding-v3"   # DashScope Embedding 模型
      embedding-dim: 1024                    # text-embedding-v3 默认 1024 维

# ========== Prompt 模板化管理配置 ==========
  chatbot:
    prompt:
      # 默认 Prompt 场景标识
      scene: default
      # 缓存过期时间（分钟）
      cache-ttl-minutes: 10

# DashScope Embedding API 配置（阿里云百炼）
dashscope:
  api:
    # 从环境变量读取；未设置时默认空串，Embedding 调用会失败但应用仍能启动（自动降级关键词匹配）
    key: ${DASHSCOPE_API_KEY:}
    base-url: https://dashscope.aliyuncs.com
